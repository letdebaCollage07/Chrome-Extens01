<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Extension
        </title>
        <link rel="stylesheet" href="index.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #fafafa;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                min-width: 400px;
                padding: 20px;
            }
            .brand-header {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-bottom: 20px;
                padding-bottom: 12px;
                border-bottom: 1px solid #e0e0e0;
            }
            .brand-header span {
                font-size: 12px;
                color: #4FC3F7;
                font-weight: 600;
                letter-spacing: 1px;
            }
            .mainHead {
                color: #333;
                text-align: center;
                margin-bottom: 20px;
                font-size: 18px;
                font-weight: 500;
            }
            .input-group {
                display: flex;
                gap: 10px;
                margin-bottom: 20px;
            }
            #input-El {
                flex: 1;
                padding: 12px 15px;
                border: 1px solid #ddd;
                border-radius: 6px;
                background: #fff;
                font-size: 14px;
                transition: all 0.3s ease;
                color: #333;
            }
            #input-El:focus {
                outline: none;
                border-color: #4FC3F7;
                box-shadow: 0 0 6px rgba(79, 195, 247, 0.2);
            }
            .button-group {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
                margin-bottom: 20px;
            }
            button {
                border: 1px solid #ddd;
                border-radius: 6px;
                font-weight: 500;
                font-size: 12px;
                cursor: pointer;
                transition: all 0.3s ease;
                background: #fff;
                color: #333;
            }
            #input-Btn {
                background: #4FC3F7;
                color: white;
                border-color: #4FC3F7;
            }
            #input-Btn:hover {
                background: #29B6F6;
                border-color: #29B6F6;
                box-shadow: 0 2px 8px rgba(79, 195, 247, 0.3);
            }
            #saveTab-Btn {
                background: #4FC3F7;
                color: white;
                border-color: #4FC3F7;
            }
            #saveTab-Btn:hover {
                background: #29B6F6;
                border-color: #29B6F6;
                box-shadow: 0 2px 8px rgba(79, 195, 247, 0.3);
            }
            #clear-Btn {
                background: #fff;
                border-color: #4FC3F7;
                color: #4FC3F7;
            }
            #clear-Btn:hover {
                background: #F0F8FF;
                box-shadow: 0 2px 8px rgba(79, 195, 247, 0.2);
            }
            button:active {
                transform: scale(0.98);
            }
            #link-El {
                list-style: none;
                background: #fff;
                border-radius: 6px;
                padding: 10px 0;
                max-height: 300px;
                overflow-y: auto;
                border: 1px solid #e0e0e0;
            }
            #link-El li {
                background: #fff;
                padding: 10px 15px;
                border-bottom: 1px solid #f0f0f0;
                word-break: break-word;
                animation: slideIn 0.3s ease;
                transition: all 0.2s ease;
            }
            #link-El li:last-child {
                border-bottom: none;
            }
            #link-El a {
                color: #4FC3F7;
                text-decoration: none;
                font-weight: 500;
                font-size: 13px;
            }
            #link-El a:hover {
                color: #29B6F6;
            }
            #link-El li:hover {
                background: #f9f9f9;
            }
            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            #link-El::-webkit-scrollbar {
                width: 6px;
            }
            #link-El::-webkit-scrollbar-track {
                background: #f0f0f0;
                border-radius: 6px;
            }
            #link-El::-webkit-scrollbar-thumb {
                background: #4FC3F7;
                border-radius: 6px;
            }
            #link-El::-webkit-scrollbar-thumb:hover {
                background: #29B6F6;
            }
        </style>
    </head>
    <body>
        <div class="brand-header">
            <span>◇ onwater</span>
        </div>
        <h1 class="mainHead">My Links</h1>
        <div class="input-group">
            <input type="text" id="input-El" placeholder="Enter a link or text...">
        </div>
        <div class="button-group">
            <button id="input-Btn">SAVE INPUT</button>
            <button id="saveTab-Btn">Save Tab</button>
            <button id="delete-selected-Btn">Delete Selected</button>
        </div>
        <ul id="link-El">


        </ul>
        <script src="index.js"></script>
    </body>
</html>
